name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that playwright-tia doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The shape of the change — CLI flag, config field, API, output.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried instead (forceRun globs, config, other tools).
